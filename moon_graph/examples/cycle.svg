<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 310 344" width="310" height="344" role="img" aria-label="retry-state-machine">
<title>retry-state-machine</title>
<defs><marker id="moon-graph-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#607088"/></marker></defs>
<g data-node="ready"><title>ready</title><rect x="24" y="24" width="100" height="48" rx="6" fill="#eef4ff" stroke="#5174a5"/>
<text x="74" y="52" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#172b4d">待执行</text>
</g>
<g data-node="running"><title>running</title><rect x="24" y="132" width="100" height="48" rx="6" fill="#eef4ff" stroke="#5174a5"/>
<text x="74" y="160" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#172b4d">执行中</text>
</g>
<g data-node="retry"><title>retry</title><rect x="24" y="240" width="100" height="48" rx="6" fill="#eef4ff" stroke="#5174a5"/>
<text x="74" y="268" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#172b4d">等待重试</text>
</g>
<g data-node="done"><title>done</title><rect x="154" y="240" width="100" height="48" rx="6" fill="#eef4ff" stroke="#5174a5"/>
<text x="204" y="268" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#172b4d">完成</text>
</g>
<path data-edge="start" d="M 74 72 L 74 84 L 74 120 L 74 132 " fill="none" stroke="#607088" stroke-width="1.5" marker-end="url(#moon-graph-arrow)"><title>start</title></path>
<path data-edge="failed" d="M 74 180 L 74 192 L 74 228 L 74 240 " fill="none" stroke="#607088" stroke-width="1.5" marker-end="url(#moon-graph-arrow)"><title>failed</title></path>
<path data-edge="again" d="M 74 240 L 74 228 L 74 192 L 74 180 " fill="none" stroke="#607088" stroke-width="1.5" marker-end="url(#moon-graph-arrow)"><title>again</title></path>
<path data-edge="success" d="M 102.88888888888889 180 L 102.88888888888889 192 L 102.88888888888889 228 L 175.11111111111111 228 L 175.11111111111111 240 " fill="none" stroke="#607088" stroke-width="1.5" marker-end="url(#moon-graph-arrow)"><title>success</title></path>
<path data-edge="heartbeat" d="M 124 156 L 144 156 L 144 200 L 74 200 L 74 180 " fill="none" stroke="#607088" stroke-width="1.5" marker-end="url(#moon-graph-arrow)"><title>heartbeat</title></path>
</svg>

